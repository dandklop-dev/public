<style>
:root { --bg: #f2f6f6; --card: #ffffff; --ink: #0f1a1c; --ink-2: #485759; --line: #c3cdcf; --accent: #00707a; --on-accent: #ffffff; --err: #c93636; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1415; --card: #162022; --ink: #edf2f2; --ink-2: #b6c3c5; --line: #334446; --accent: #45b9c2; --on-accent: #0e1415; --err: #ec7070; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--ink-2); font-size: 14px; }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button[disabled] { opacity: .6; cursor: progress; }
.err { color: var(--err); font-size: 14px; min-height: 1.5em; }
</style></head>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

  document.open(); document.write(html); document.close();
}
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async e => {

  try { await unlock(document.getElementById('pw').value.trim().toUpperCase()); }
  catch (x) { err.textContent = 'Неверный пароль. Проверьте раскладку и попробуйте ещё раз.'; go.disabled = false; go.textContent = 'Открыть'; }
